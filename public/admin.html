<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>腕表管理后台</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f3;color:#29382b;font:14px Arial,'Microsoft YaHei',sans-serif}header{background:white;border-bottom:1px solid #ddd;padding:24px 5%;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;font-weight:400;margin:0}a{color:inherit}main{max-width:1150px;margin:auto;padding:30px 24px}.layout{display:grid;grid-template-columns:230px 1fr;gap:26px}aside,form{background:white;padding:24px;border:1px solid #e0e3da}button,input,textarea,select{font:inherit}button{cursor:pointer;background:#293e30;color:white;border:0;padding:12px 20px}.list button{display:block;width:100%;text-align:left;margin:7px 0;background:#f1f3ec;color:#3e4936}.list .active{background:#293e30;color:white}label{display:block;font-size:12px;color:#7a8570;margin:20px 0 8px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8ddd0;background:white;color:#29382b}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}.images{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.images img{width:100%;height:150px;object-fit:contain;background:#f3f4ef}.images button{font-size:11px;padding:8px;background:#e9ece2;color:#34432d;margin-right:5px}.hint{color:#818c75;font-size:12px;line-height:1.8}.savebar{margin-top:30px;display:flex;gap:20px;align-items:center;position:sticky;bottom:0;background:white;padding:15px 0}#status{font-size:13px}.brandtitle{font-size:12px;color:#88907e;margin-top:24px}#error{color:#a3332b}#brand{width:100%}@media(max-width:700px){.layout{grid-template-columns:1fr}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.row{grid-template-columns:1fr}.images{grid-template-columns:repeat(2,1fr)}header{gap:20px}}</style><header><h1>时序 · 商品管理</h1><a href="/" target="_blank" rel="noopener">查看前台 ↗</a></header><main><p class="hint">选择商品 → 修改内容或上传图片 → 保存。每个品牌保留 6 款商品，数据存储在本机文件中。</p><p id="error" role="alert"></p><div class="layout"><aside><label for="brand">选择品牌</label><select id="brand"></select><label for="brandname">品牌名称 · 可自由修改</label><input id="brandname" maxlength="80" placeholder="输入你的品牌名称"><button type="button" id="rename" style="margin-top:10px">应用品牌名称</button><p class="hint">“品牌 A、品牌 B”只是占位名称，可以改成你的名称。也可以直接改名后点击“保存并更新前台”。</p><div class="list" id="list"></div></aside><form id="editor" hidden><details open style="border:1px solid #ddd;padding:18px;margin-bottom:25px"><summary style="cursor:pointer;font-size:18px">网站界面文字</summary><p class="hint">前台的名称、标题、导航、按钮和页脚均可在这里修改，保存后刷新前台即可显示。</p><div id="siteTexts"></div></details><h2 id="heading" style="font-weight:400"></h2><label for="name">商品名称</label><input id="name" required maxlength="150"><div class="row"><div><label for="price">价格</label><input id="price" placeholder="例如 ¥2,800 或 $399" maxlength="60"></div><div><label for="url">独立商品链接 · 自动生成</label><input id="productPermalink" readonly><button type="button" id="copyPermalink">复制商品链接</button><a id="openPermalink" target="_blank" rel="noopener" style="display:inline-block;margin-top:12px">打开商品页 ↗</a><input id="url" type="hidden"></div></div><label for="description">商品介绍</label><textarea id="description" maxlength="3000"></textarea><label for="upload">添加商品图片</label><input type="file" id="upload" accept="image/jpeg,image/png,image/webp" multiple><p class="hint">支持 JPG、PNG、WebP，每款最多 6 张。上传时会自动压缩，第一张作为封面；可以移动图片或删除。</p><div class="images" id="images"></div><div class="savebar"><button id="save" type="submit">保存并更新前台</button><span id="status" role="status" aria-live="polite"></span></div></form></div></main><script>
let data,current,dirty=false,busy=false;
const textLabels={logo:'网站名称',navigation:'导航文字',headerCaption:'顶部英文文字',eyebrow:'首页小标题',title:'首页主标题',subtitle:'首页介绍',allBrands:'全部品牌按钮',search:'搜索框提示',detail:'查看详情按钮',productLink:'商品跳转按钮',missingLink:'未填写链接时的文字',imagePlaceholder:'图片占位提示',imageLabel:'图片标签',watchUnit:'商品数量单位',empty:'搜索无结果提示',note:'页面底部说明',footerLeft:'页脚左侧',footerMiddle:'页脚中间',footerRight:'页脚右侧'};
function siteTextFields(){data.texts=data.texts||{};$('siteTexts').innerHTML=Object.entries(textLabels).map(([key,label])=>'<label for="text-'+key+'">'+esc(label)+'</label><input id="text-'+key+'" data-site-text="'+key+'" value="'+esc(data.texts[key]||'')+'">').join('');$('siteTexts').querySelectorAll('input').forEach(input=>input.oninput=()=>{data.texts[input.dataset.siteText]=input.value;dirty=true;$('status').textContent='界面文字已修改，请点击保存'})}
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function changes(){if(!current)return;current.name=$('name').value;current.price=$('price').value;current.url=$('url').value;current.description=$('description').value;dirty=true;$('status').textContent='尚未保存'}
function list(){const b=$('brand').value;$('brandname').value=b;$('list').innerHTML=data.products.filter(p=>p.brand===b).map(p=>`<button type="button" data-id="${p.id}" class="${current&&current.id===p.id?'active':''}">${esc(p.name)}</button>`).join('');$('list').querySelectorAll('button').forEach(btn=>btn.onclick=()=>select(Number(btn.dataset.id)))}
function select(id){if(current)changes();current=data.products.find(p=>p.id===id);$('editor').hidden=false;['name','price','url','description'].forEach(k=>$(k).value=current[k]||'');$('heading').textContent=current.name;$('productPermalink').value=location.origin+'/product/'+current.id;$('openPermalink').href=$('productPermalink').value;list();images()}
function images(){$('images').innerHTML=current.images.map((src,i)=>`<div><img src="${esc(src)}" alt="商品图片 ${i+1}"><p class="hint">${i===0?'封面图':'图片 '+(i+1)}</p>${i?`<button type="button" data-up="${i}">前移</button>`:''}<button type="button" data-remove="${i}">删除</button></div>`).join('');$('images').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{current.images.splice(Number(b.dataset.remove),1);dirty=true;images();$('status').textContent='图片已删除，尚未保存'});$('images').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.up);[current.images[i-1],current.images[i]]=[current.images[i],current.images[i-1]];dirty=true;images()})}
async function compress(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('请选择 JPG、PNG 或 WebP 图片');if(file.size>20*1024*1024)throw Error('单张图片不能超过 20 MB');const bitmap=await createImageBitmap(file);const ratio=Math.min(1,1500/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*ratio);canvas.height=Math.round(bitmap.height*ratio);const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return canvas.toDataURL('image/jpeg',.84)}
$('upload').onchange=async()=>{busy=true;$('save').disabled=true;$('error').textContent='';try{const files=[...$('upload').files];if(files.length+current.images.length>6)throw Error('每款最多上传 6 张图片');const additions=[];for(const f of files)additions.push(await compress(f));current.images.push(...additions);dirty=true;images();$('status').textContent='图片已添加，请点击保存'}catch(e){$('error').textContent=e.message}finally{busy=false;$('save').disabled=false;$('upload').value=''}};
$('brand').onchange=()=>{if(current)changes();list();select(data.products.find(p=>p.brand===$('brand').value).id)};
function applyBrand(){const old=$('brand').value,name=$('brandname').value.trim();if(!name||name.length>80||data.brands.includes(name)&&name!==old){$('error').textContent='请输入不重复的品牌名称，最多80个字';return false}if(name!==old){data.brands=data.brands.map(b=>b===old?name:b);data.products.forEach(p=>{if(p.brand===old)p.brand=name});brands(name);dirty=true;list()}return true}
$('rename').onclick=()=>{if(applyBrand())$('status').textContent='品牌已修改，请点击保存'};
function brands(selected){$('brand').innerHTML=data.brands.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');if(selected)$('brand').value=selected}
['name','price','url','description'].forEach(k=>$(k).oninput=changes);
$('editor').onsubmit=async e=>{e.preventDefault();if(busy)return;if(!applyBrand())return;changes();$('save').disabled=true;$('status').textContent='正在保存…';$('error').textContent='';try{const res=await fetch('/api/catalog',{method:'PUT',headers:{'Content-Type':'application/json','X-Catalog-Editor':'1'},body:JSON.stringify(data)});const result=await res.json();if(!res.ok)throw Error(result.error||'保存失败');dirty=false;list();$('heading').textContent=current.name;$('status').textContent='已保存，刷新前台即可查看'}catch(e){$('error').textContent=e.message;$('status').textContent='保存失败，修改仍保留在当前页面'}finally{$('save').disabled=false}};
$('copyPermalink').onclick=async()=>{try{await navigator.clipboard.writeText($('productPermalink').value);$('status').textContent='商品链接已复制'}catch{$('productPermalink').select();$('status').textContent='请复制选中的商品链接'}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
fetch('/api/catalog').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d;siteTextFields();brands();list();select(data.products[0].id);dirty=false}).catch(()=>$('error').textContent='无法加载，请确认启动窗口仍在运行，然后刷新页面。');
</script></html>
