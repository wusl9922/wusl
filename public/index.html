<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时序 · 腕表目录</title><style>*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#292e28;font:14px Arial,'Microsoft YaHei',sans-serif}header,footer{padding:28px 6%;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.logo{font-size:25px;letter-spacing:5px}main{max-width:1400px;margin:auto;padding:0 6%}h1{font-size:40px;font-weight:400;margin:18px 0}h2,h3{font-weight:400}p{color:#858a80;line-height:1.8}small{color:#989d92;letter-spacing:2px}.intro{padding:65px 0 40px}.toolbar{display:flex;justify-content:space-between;gap:12px;padding:20px 0;border-block:1px solid #ddd}.tabs{display:flex;gap:8px}button,input{font:inherit;border:1px solid #d9ddd3;background:transparent;padding:11px 18px;color:inherit}button{cursor:pointer}.active{background:#293c30;color:white}input{width:240px}section{padding:30px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.photo{width:100%;aspect-ratio:1;background:#eeefea;display:grid;place-items:center;position:relative;border:0}.photo svg{width:40%;height:70%;color:#bdc4b6}.photo small{position:absolute;bottom:18px;font-size:10px}.card h3{font-size:18px;margin-bottom:6px}.card p{font-size:12px}.prices{padding:15px 0;border-block:1px solid #ddd}.prices strong{font-weight:400;font-size:17px;color:#35412f}.actions{display:flex;justify-content:space-between;margin-top:20px;font-size:12px}.actions button{padding:0;border:0}.disabled{color:#9da393}a{color:inherit;text-decoration:none}footer{margin-top:55px;font-size:11px;color:#8d9385;border-top:1px solid #ddd;gap:20px}dialog{max-width:92%;width:700px;border:1px solid #ddd;padding:30px;background:#fafaf8}dialog::backdrop{background:#17201799}.close{float:right;border:0;font-size:24px;padding:0 8px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:30px}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.note{font-size:11px;color:#92998b;margin:25px 0}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #526c43;outline-offset:3px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:18px}.toolbar{flex-direction:column}input{width:100%}.detail{grid-template-columns:1fr}footer{flex-direction:column}header small{display:none}h1{font-size:32px}}@media(max-width:380px){.grid{grid-template-columns:1fr}}</style><header><a class="logo" href="/">时 序</a><a href="/#catalog">腕表目录</a><small>WATCH COLLECTION</small></header><main><div class="intro"><small>THE WATCH EDIT</small><h1>简于形，精于选。</h1><p>按品牌浏览腕表，查看款式、商品介绍与价格。</p></div><div class="toolbar"><div class="tabs" id="tabs"></div><input id="search" placeholder="搜索品牌或款式…" aria-label="搜索品牌或款式"></div><div id="catalog"></div><p class="note">当前为布局模板，品牌、商品、图片、价格及链接均待填写。</p></main><footer><span>时序 · 腕表目录</span><span>商品展示与信息浏览</span><span>© 2026 WATCH COLLECTION</span></footer><dialog id="detail"><button class="close" aria-label="关闭详情" onclick="this.closest('dialog').close()">×</button><div id="body"></div></dialog><script>
// 在这里填入品牌、款式、图片网址、商品价格和外部商品网址。
let brands=[],products=[],texts={};const text=(key,fallback)=>texts[key]??fallback;let selected='全部品牌';const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function safe(u){try{let v=new URL(u);return ['https:','http:'].includes(v.protocol)||/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u)?v.href:''}catch{return ''}}
function photo(p,n=0){const u=safe(p.images[n]);return u?`<div class="photo"><img style="width:100%;height:100%;object-fit:contain" src="${esc(u)}" alt="${esc(p.name)} 商品图 ${n+1}"></div>`:`<div class="photo"><svg viewBox="0 0 100 180" fill="none" aria-hidden="true"><path d="M34 4h32l4 49H30L34 4ZM30 127h40l-4 49H34l-4-49Z" stroke="currentColor" stroke-width="2"/><circle cx="50" cy="90" r="38" stroke="currentColor" stroke-width="2"/><circle cx="50" cy="90" r="31" stroke="currentColor"/><path d="M50 67v23l15 10" stroke="currentColor" stroke-width="2"/></svg><small>${esc(text("imageLabel","商品图"))} ${n+1} · ${esc(text("imagePlaceholder","待添加"))}</small></div>`}
function prices(p){return `<div class="prices"><strong>${esc(p.price)}</strong></div>`}function productUrl(p){return "/product/"+encodeURIComponent(p.id)}function link(p){return `<a href="${productUrl(p)}">查看商品页 ↗</a>`}
function applyPageText(){const mapping={'header .logo':'logo','header>a:not(.logo)':'navigation','header small':'headerCaption','.intro small':'eyebrow','.intro h1':'title','.intro p':'subtitle','main>.note':'note','footer span:nth-child(1)':'footerLeft','footer span:nth-child(2)':'footerMiddle','footer span:nth-child(3)':'footerRight'};for(const [selector,key] of Object.entries(mapping)){const e=document.querySelector(selector);if(e&&texts[key]!==undefined)e.textContent=texts[key]}document.title=text('logo','腕表目录');if(document.querySelector('#search'))document.querySelector('#search').placeholder=text('search','搜索品牌或款式…')}
function render(){const q=$('#search').value.trim().toLowerCase();$('#tabs').innerHTML=['全部品牌',...brands].map(b=>`<button class="${b===selected?'active':''}" data-brand="${esc(b)}">${esc(b==='全部品牌'?text('allBrands',b):b)}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.brand;render()});let count=0;$('#catalog').innerHTML=brands.filter(b=>selected==='全部品牌'||b===selected).map(b=>{const list=products.filter(p=>p.brand===b&&(p.name+p.brand+p.description).toLowerCase().includes(q));count+=list.length;return list.length?`<section><h2>${esc(b)} <small style="font-size:10px">${list.length} ${esc(text("watchUnit","款腕表"))}</small></h2><div class="grid">${list.map(p=>`<article class="card"><button style="width:100%;border:0;padding:0" aria-label="查看${esc(p.name)}" onclick="location.href=productUrl(products.find(p=>p.id===${p.id}))">${photo(p)}</button><h3><a href="${productUrl(p)}">${esc(p.name)}</a></h3><p>${esc(p.description)}</p>${prices(p)}<div class="actions"><button onclick="show(${p.id})">${esc(text("detail","查看详情 ＋"))}</button>${link(p)}</div></article>`).join('')}</div></section>`:''}).join('');if(!count)$('#catalog').innerHTML=`<p style="padding:60px 0;text-align:center">${esc(text("empty","暂无匹配款式，请尝试其他关键词。"))}</p>`}
function renderProduct(){const id=Number(location.pathname.split('/')[2]),p=products.find(p=>p.id===id);if(!p){document.querySelector('main').innerHTML='<p>商品不存在。<a href="/">返回目录</a></p>';return}document.title=p.name+' · '+text('logo','腕表目录');document.querySelector('main').innerHTML=`<p style="padding-top:25px;font-size:12px"><a href="/">← 返回腕表目录</a> / ${esc(p.brand)}</p><div class="detail" style="margin-top:35px;gap:45px"><div>${photo(p)}<div class="gallery">${p.images.slice(1).map((_,i)=>photo(p,i+1)).join('')}</div></div><div><small>${esc(p.brand)}</small><h1 style="font-size:30px;line-height:1.5">${esc(p.name)}</h1><p style="white-space:pre-line">${esc(p.description)}</p>${prices(p)}<button id="copyProduct" style="margin-top:25px">复制商品链接</button><p id="copyStatus" role="status" style="font-size:12px"></p></div></div><p class="note">${esc(text('note',''))}</p>`;document.querySelector('#copyProduct').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.querySelector('#copyStatus').textContent='链接已复制'}catch{document.querySelector('#copyStatus').textContent=location.href}}}
function show(id){const p=products.find(x=>x.id===id);$('#body').innerHTML=`<div class="detail"><div>${photo(p)}<div class="gallery">${photo(p,1)}${photo(p,2)}</div></div><div><small>${esc(p.brand)}</small><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p>${prices(p)}<div class="actions">${link(p)}</div></div></div>`;$('#detail').showModal()}$('#search').oninput=render;async function load(){try{const r=await fetch('/api/catalog');if(!r.ok)throw Error();const d=await r.json();brands=d.brands;products=d.products;texts=d.texts||{};applyPageText();if(/^\/product\/\d+$/.test(location.pathname))renderProduct();else render()}catch{$('#catalog').textContent='无法加载商品，请确认网站服务已启动并刷新。'}}load();window.addEventListener('focus',load);
</script></html>
